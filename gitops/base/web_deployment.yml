# MARK: - Web Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: greentech-web
  namespace: greentech
  labels:
    app.kubernetes.io/name: greentech-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: greentech-web

  template:
    metadata:
      labels:
        app.kubernetes.io/name: greentech-web
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: greentech-web
          image: asia-northeast3-docker.pkg.dev/ncp-gcp-dr-v2/dr-rebuild-lab-images/greentech-web:dab14ca
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: greentech-web-config

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3