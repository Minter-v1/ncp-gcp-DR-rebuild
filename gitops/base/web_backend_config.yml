# MARK: - Web Load Balancer Backend

apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: greentech-web-backend
  namespace: greentech
spec:
  timeoutSec: 30

  connectionDraining:
    drainingTimeoutSec: 30

  healthCheck:
    type: HTTP
    requestPath: /login
    port: 3000
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3

  logging:
    enable: true
    sampleRate: 1.0