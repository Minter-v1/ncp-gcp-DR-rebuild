# MARK: - Secret Manager Mount Test

apiVersion: v1
kind: Pod
metadata:
  name: secret-mount-test
  namespace: greentech
spec:
  serviceAccountName: greentech-was
  restartPolicy: Never

  # NOTE: - Workload Identity가 활성화된 Standard GKE Node에 배치
  nodeSelector:
    iam.gke.io/gke-metadata-server-enabled: "true"

  containers:
    - name: verifier
      image: busybox:1.36.1

      command:
        - sh
        - -c

      args:
        - |
          test -s /var/run/secrets/greentech-db/DB_URL
          test -s /var/run/secrets/greentech-db/DB_USERNAME
          test -s /var/run/secrets/greentech-db/DB_PASSWORD
          printf 'DB_URL=MOUNTED\n'
          printf 'DB_USERNAME=MOUNTED\n'
          printf 'DB_PASSWORD=MOUNTED\n'
          sleep 3600

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532

      volumeMounts:
        - name: database-secrets
          mountPath: /var/run/secrets/greentech-db
          readOnly: true

  volumes:
    - name: database-secrets
      csi:
        driver: secrets-store-gke.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: greentech-db